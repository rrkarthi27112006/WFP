{% extends "base.html" %}
{% block title %}Login — EduTrack{% endblock %}
{% block guest_content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to your EduTrack account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <p>
        <label for="id_username">Username</label>
        {{ form.username }}
      </p>
      <p>
        <label for="id_password">Password</label>
        {{ form.password }}
      </p>
      <button type="submit" class="btn btn-accent" style="width:100%;">Login</button>
    </form>
    <p class="auth-links">New to EduTrack? <a href="{% url 'accounts:register_choice' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
