{% extends "base.html" %}
{% block title %}Student Registration — EduTrack{% endblock %}
{% block guest_content %}
<div class="auth-shell">
  <div class="form-card">
    <h1>Student Registration</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-accent">Create Account</button>
    </form>
    <p class="auth-links">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
  </div>
</div>
{% endblock %}
