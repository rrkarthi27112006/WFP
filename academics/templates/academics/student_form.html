{% extends "base.html" %}
{% block title %}Edit Student — EduTrack{% endblock %}
{% block content %}
<h1>Edit {{ student.user.get_full_name|default:student.user.username }}</h1>
<div class="form-card">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-accent">Save</button>
    <a href="{% url 'academics:student_list' %}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
