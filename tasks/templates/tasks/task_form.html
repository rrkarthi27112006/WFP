{% extends "base.html" %}
{% block title %}{{ title }} — EduTrack{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="form-card">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-accent">Save Task</button>
    <a href="{% url 'tasks:teacher_task_list' %}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
